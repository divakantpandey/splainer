[project]
name = "splainer-sdk"
version = "0.1.0"
description = "Python SDK for the Splainer SPL-to-SQL translation engine."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "spl-to-sql",        # core library (resolved via workspace)
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = ["anyio>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.14", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splainer_sdk"]

